name: guitar_tuner_app
description: "Production-ready real-time guitar tuner built with Flutter (MVVM + Bloc)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  record: ^6.1.1
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  audioplayers: ^6.7.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Generates the Android/iOS launcher (home screen) icon from the
  # source image below. Run: flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/ui/

# flutter_launcher_icons config — reads assets/icon/logo.png and
# generates all required Android/iOS icon sizes.
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/TMJ.png"
  min_sdk_android: 21
  remove_alpha_ios: true